AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project
Parameters:
  RepositoryOwner:
    Type: String
    Description: The owner of the repository.  Will be used as the project name
Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2008-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Federated: arn:aws:iam::449435941126:oidc-provider/token.actions.githubusercontent.com
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${RepositoryOwner}/Synapse-Stack-Builder:ref:refs/heads/*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref "RepositoryOwner"
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${RepositoryOwner}/Synapse-Stack-Builder"
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        InsecureSsl: false
        ReportBuildStatus: false
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables: []
      # TODO delete dead code ServiceRole: !Ref ExecutionRole
      ServiceRole: arn:aws:iam::449435941126:role/synapse-dev-cmk-SynapseDeploymentRole-15QJA2H05YVY
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      EncryptionKey: arn:aws:kms:us-east-1:449435941126:alias/aws/s3
      VpcConfig:
        VpcId: vpc-0f126dc4dd46853a6
        Subnets:
          - subnet-0bbca9690202e2605
          - subnet-0e76448649e0636b4
          - subnet-08d6e58487e45e94f
          - subnet-0a05b9d8a855b3936
          - subnet-0ad4945b93afc68f4
          - subnet-094fb1d1838d905a3
        SecurityGroupIds:
          - sg-0818ba0f1872103d4
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
